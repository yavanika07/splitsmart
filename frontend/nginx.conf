server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the Spring Boot container (service name "backend" in docker-compose)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router: send unknown paths to index.html so /groups/5 works on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
