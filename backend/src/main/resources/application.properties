spring.application.name=splitsmart
server.port=8080

# ---------- Database ----------
# Locally: create the DB first ->  CREATE DATABASE splitsmart;
# In Docker these come from docker-compose.yml environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/splitsmart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Auto-create/update tables from entities (fine for a project like this)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Must be at least 32 characters. Override with the JWT_SECRET env variable.
app.jwt.secret=${JWT_SECRET:splitsmart-dev-secret-change-me-0123456789abcdef}
# 24 hours
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
# Comma separated. The Vite dev server proxies /api, so this mostly matters for other clients.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
